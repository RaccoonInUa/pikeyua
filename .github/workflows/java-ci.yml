name: Java CI

on:
  push:
    branches: [main, v7.1-persistence, feature/v7.2-discoverable-credentials, feature/v7.3-pin-uv]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate existing cutover scripts
        run: bash scripts/check-cutover-syntax.sh
      - name: Existing mocked cutover regressions
        run: bash scripts/test-cutover-mock.sh
      - name: Test and assemble
        run: gradle --no-daemon --no-build-cache clean test shadowJar
      - name: Summarize unit results
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in glob.glob('build/test-results/test/TEST-*.xml')]
          total = sum(int(r.get('tests', 0)) for r in reports)
          failed = sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in reports)
          skipped = sum(int(r.get('skipped', 0)) for r in reports)
          assert total > 0 and failed == 0 and skipped == 0
          print(f'UNIT RESULTS: {total} passed, {failed} failed, {skipped} skipped')
          PY
      - name: Multi-process persistence and failure tests
        run: sh scripts/verify-persistence.sh build/libs/pikeyua.jar
      - name: V7.1 to V7.2 independent-JVM migration regression
        run: sh scripts/verify-v72-migration.sh build/libs/pikeyua.jar
      - name: Resident credential lifecycle across independent JVMs
        run: java -cp build/libs/pikeyua.jar com.github.mphi_rc.fido2.ResidentCredentialProbe
      - name: PIN and UV lifecycle across independent JVMs
        run: java -cp build/libs/pikeyua.jar com.github.mphi_rc.fido2.PinUvProbe
      - name: Checkout immutable V7.1 baseline
        if: matrix.java == '17'
        uses: actions/checkout@v4
        with:
          ref: 2b2183924a2dfca16327a8b7dc0940e37a563381
          path: _v71_reference
      - name: Build original V7.1 for migration test
        if: matrix.java == '17'
        run: gradle -p _v71_reference --no-daemon shadowJar
      - name: Verify genuine V7.1 JSON compatibility
        if: matrix.java == '17'
        run: sh scripts/verify-v72-cross-version.sh _v71_reference/build/libs/pikeyua.jar build/libs/pikeyua.jar
      - name: Upload V7.1 candidate
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/v7.1-persistence'
        uses: actions/upload-artifact@v4
        with:
          name: pikeyua-v7.1-candidate-jdk17
          path: build/libs/pikeyua.jar
          if-no-files-found: error
          retention-days: 7
      - name: Package PIN/UV lab candidate
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/feature/v7.3-pin-uv'
        run: |
          mkdir -p build/pin-candidate
          cp build/libs/pikeyua.jar build/pin-candidate/
          printf '%s\n' "$GITHUB_SHA" > build/pin-candidate/COMMIT.txt
          (cd build/pin-candidate && sha256sum pikeyua.jar > SHA256SUMS)
          printf '%s\n' 'LAB CANDIDATE. No hardware/browser qualification yet.' 'First run without sudo: java -cp pikeyua.jar com.github.mphi_rc.fido2.PinUvProbe' 'Do not run this JAR against your live state before reviewing V7_3_PIN_UV.md.' > build/pin-candidate/TEST_ONLY.txt
      - name: Upload PIN/UV lab candidate
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/feature/v7.3-pin-uv'
        uses: actions/upload-artifact@v4
        with:
          name: pikeyua-v7.3-pin-uv-lab-jdk17
          path: build/pin-candidate/
          if-no-files-found: error
          retention-days: 7
