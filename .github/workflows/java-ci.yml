name: Java CI

on:
  push:
    branches: [main, v7.1-persistence]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Test and assemble
        run: gradle --no-daemon test shadowJar
      - name: Upload test-only ARM-compatible Java JAR
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/v7.1-persistence'
        uses: actions/upload-artifact@v4
        with:
          name: pikeyua-v7.1-candidate-jdk17
          path: build/libs/pikeyua.jar
          if-no-files-found: error
          retention-days: 7
