name: Java CI

on:
  push:
    branches: [main, v7.1-persistence, feature/v7.2-discoverable-credentials]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate reversible cutover scripts
        run: bash scripts/check-cutover-syntax.sh
      - name: Mocked USB cutover and rollback state-machine tests
        run: bash scripts/test-cutover-mock.sh
      - name: Test and assemble
        run: gradle --no-daemon test shadowJar
      - name: Multi-process persistence and failure tests
        run: sh scripts/verify-persistence.sh build/libs/pikeyua.jar
      - name: V7.1 to V7.2 independent-JVM migration regression
        run: sh scripts/verify-v72-migration.sh build/libs/pikeyua.jar
      - name: Checkout immutable V7.1 baseline for cross-version compatibility
        if: matrix.java == '17'
        uses: actions/checkout@v4
        with:
          ref: 2b2183924a2dfca16327a8b7dc0940e37a563381
          path: _v71_reference
      - name: Build original V7.1 candidate for migration test
        if: matrix.java == '17'
        run: gradle -p _v71_reference --no-daemon shadowJar
      - name: Verify real V7.1 JSON against V7.2 migration
        if: matrix.java == '17'
        run: sh scripts/verify-v72-cross-version.sh _v71_reference/build/libs/pikeyua.jar build/libs/pikeyua.jar
      - name: Upload test-only ARM-compatible Java JAR
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/v7.1-persistence'
        uses: actions/upload-artifact@v4
        with:
          name: pikeyua-v7.1-candidate-jdk17
          path: build/libs/pikeyua.jar
          if-no-files-found: error
          retention-days: 7
