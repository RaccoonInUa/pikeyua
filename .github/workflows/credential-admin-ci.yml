name: Credential admin CI

on:
  push:
    branches: [main, feature/local-credential-management]
  pull_request:
    paths:
      - 'scripts/pikeyua-credentials.py'
      - 'tests/**'
      - 'docs/CREDENTIAL_MANAGEMENT.md'
      - '.github/workflows/credential-admin-ci.yml'

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Python CLI regression tests (no root or real service)
        run: python3 -m unittest discover -s tests -p 'test_credentials_cli.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Checkout exact browser-tested V7.3 baseline
        uses: actions/checkout@v4
        with:
          ref: ad1c3c7fbefdaacffe3bf5024fcb03c07df4f662
          path: _v73_reference
      - name: Build untouched V7.3 JAR
        run: gradle -p _v73_reference --no-daemon shadowJar
      - name: Genuine Java state to Python delete to new Java process
        run: python3 tests/verify_credentials_with_jar.py _v73_reference/build/libs/pikeyua.jar
      - name: Package standalone CLI (no JAR or keys)
        if: matrix.java == '17' && github.event_name == 'push'
        run: |
          mkdir -p build/credential-cli
          cp scripts/pikeyua-credentials.py docs/CREDENTIAL_MANAGEMENT.md build/credential-cli/
          printf '%s\n' "$GITHUB_SHA" > build/credential-cli/COMMIT.txt
          (cd build/credential-cli && sha256sum pikeyua-credentials.py CREDENTIAL_MANAGEMENT.md > SHA256SUMS)
      - name: Upload standalone CLI
        if: matrix.java == '17' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pikeyua-credential-cli
          path: build/credential-cli/
          if-no-files-found: error
          retention-days: 14
